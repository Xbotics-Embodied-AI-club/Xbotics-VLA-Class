# Xbotics VLA 课程代码：一份环境，所有机器装的东西都一样。
#   uv sync --extra x86
# 有显卡的电脑跑训练、推理、仿真；端侧控制设备（比如学员自己没有显卡的电脑）只控制 SO-101 真机，装的也是这一套。
# extra 里另有一套 rk3566，给 ARM 的端侧板用，和 x86 互斥，只有 torch 等几个包的版本不同。
# 先装系统工具：sudo apt install build-essential cmake git
#   （LIBERO 依赖的 egl-probe 要现场编译；SO-101 仿真器从 GitHub 装）
[project]
name = "vla_class_lerobot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 维护版 LeRobot 0.6.1（就是这个目录里的 lerobot/），装全；SO-101 仿真器 so101_sim 在 x86 上随它一起装上，
    # transformers 等的版本由它来定
    "lerobot[all]",
    "torchaudio",
    # 2.1 PyTorch / Lightning、2.3 GPT2、5.4 Flow Matching 等章节用到的
    "lightning",
    "torchmetrics",
    "torchsummary",
    "tiktoken",
    "flow-matching==1.0.10",
    "wandb",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "ipython",
    "ipykernel",
    "nbconvert",
    "nbclient",
    # rerun 钉 0.26.2：维护版 LeRobot 的录制网页预览按它做的；0.33 的网页查看器只放行本机页面的跨源请求，
    # 在没有显卡加速的浏览器里一收到数据就卡死
    "rerun-sdk==0.26.2",
]

[project.optional-dependencies]
# 从 PyTorch 的 CUDA 12.8 源装（见下面 sources）
x86 = ["torch", "torchvision", "torchaudio"]
rk3566 = [
    # torch 钉 2.9.1：更新的 2.10 在一部分 ARM 核上一导入就报非法指令
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
# 锁文件里的每个包，x86 和 ARM 上都得装得上（没有现成的安装包就得有源码包，现场编译）
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
conflicts = [[{ extra = "x86" }, { extra = "rk3566" }]]
# 两样只在 x86 上装，板子上去掉：
# - torchcodec：它在 ARM 上的预编译包要 torch 2.11 以上，还依赖 NVIDIA 的库，板子上加载不了；不装它，LeRobot 直接用 PyAV 解码
# - pyrealsense2（RealSense 相机驱动）：没有 ARM 的安装包
override-dependencies = [
    "torchcodec>=0.3.0,<0.12.0; platform_machine == 'x86_64'",
    "pyrealsense2>=2.55.1.6486,<2.57.0; platform_machine == 'x86_64'",
]

[tool.uv.sources]
lerobot = { path = "./lerobot", editable = true }
torch = [{ index = "pytorch-cu128", extra = "x86" }]
torchvision = [{ index = "pytorch-cu128", extra = "x86" }]
torchaudio = [{ index = "pytorch-cu128", extra = "x86" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
